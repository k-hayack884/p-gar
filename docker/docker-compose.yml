name: ${COMPOSE_PROJECT_NAME:-p-gar}

services:
  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-18080}:80"
    volumes:
      - ../backend:/var/www/html:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - p-gar

  php:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-p_gar}
      DB_USERNAME: ${DB_USERNAME:-p_gar}
      DB_PASSWORD: ${DB_PASSWORD:-p_gar_dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - p-gar

  mysql:
    image: mysql:8.4.11
    ports:
      - "${DB_FORWARD_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-p_gar}
      MYSQL_USER: ${DB_USERNAME:-p_gar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-p_gar_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - p-gar

  node:
    image: node:22-bookworm-slim
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-15173}:5173"
    volumes:
      - ../frontend:/app
      - node-modules:/app/node_modules
    command:
      - sh
      - -c
      - |
        if [ -f package.json ]; then
          npm install
          npm run dev -- --host 0.0.0.0
        else
          echo "frontend/package.json の作成を待機します"
          tail -f /dev/null
        fi
    networks:
      - p-gar

volumes:
  mysql-data:
  node-modules:

networks:
  p-gar:
    driver: bridge
